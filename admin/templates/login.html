<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('brand') }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Outfit:wght@400;700&display=swap" media="print" onload="this.media='all'">
</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="login-wrap">
  <div class="login-card">
    <h1>{{ t('brand') }}</h1>
    <p>{{ t('login_sub') }}</p>
    {% if error %}<div class="flash err">{% if error=='locked' %}{{ t('locked') }}{% elif error=='noaccess' %}{{ t('no_access') }}{% else %}{{ t('bad_login') }}{% endif %}</div>{% endif %}
    <form method="post" action="/login">
      <label>{{ t('user') }}</label>
      <input name="username" autocomplete="username" required>
      <label>{{ t('password') }}</label>
      <input name="password" type="password" autocomplete="current-password" required>
      <p><button type="submit">{{ t('enter') }}</button></p>
    </form>
    {% if widget %}
      <p style="text-align:center;color:#9a7f88">{{ t('or') }}</p>
      <div style="display:flex;justify-content:center">
        <script async src="https://telegram.org/js/telegram-widget.js?22"
          data-telegram-login="{{ bot_user }}"
          data-size="large"
          data-auth-url="{{ public }}/login/telegram"
          data-request-access="write"></script>
      </div>
    {% else %}
      <p>{{ t('tg_need_https') }}</p>
    {% endif %}
  </div>
</div>
</body>
</html>
